
<html>
<head>
    <title>Form Elements</title>
</head>
<body>
    <section>
        <center><h1>Job Details.!!</h1></center>
    </section>
 <div>
    <form>
        <label>Registratiom Date</label>
        <input type="datetime-local"/><br/><br/>
        <label>Job Title</label>
        <input type="text" placeholder="Job Title"/><br/><br/>
        <label>company Name</label>
        <input type="text" placeholder="Enter Company name"/><br/><br/>
        <label>Contact Number</label>
        <input type="text" placeholder="Enter Contact Number"/><br/><br/>
        <label>Contact Person</label>
        <input type="text" placeholder="Enter Contact Person Number"/><br/><br/>
        <label>Email</label>
        <input type="text" placeholder="Enter Your Email"/><br/><br/>
        <label>Work status</label>
        <input type="radio"  name="work status"/>Full Time
        <input type="radio" name="work status"/>Part Time<br/><br/>
        <label>Salary</label>
        <input type="number" min="20000" max="50000"/><br/><br/>
        <label>Experience (year)</label>
        <input type="number" min="0" max="2" placeholder="Enter Your Experience Year"/><br/><br/>
        <label>Location</label>
        <input type="radio" name="Location"/>shollinganallur
        <input type="radio" name="Location"/>Guindy
        <input type="radio" name="Location"/>Patinampakkam<br/><br/>
        <label>Qualifications</label>
        <input type="radio" name="Qualifications"/>B.A
        <input type="radio" name="Qualifications"/>B.com
        <input type="radio" name="Qualifications"/>B.sc
        <input type="radio" name="Qualifications"/>Bba<br/><br/>
        <label>Skills</label>
        <input type="checkbox" name="Skills">Html5
        <input type="checkbox" name="Skills">Javascript
        <input type="checkbox" name="Skills">Css
        <input type="checkbox" name="Skills">React<br/><br/>
        <label>Description</label>
        <textarea name="" id="" cols="30" rows="10"></textarea><br/><br/>
        <input type="submit" value="Registor">
         </form>
  </div>
    </body>
</html>
